<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunter Dermott - Terminal Portfolio</title>
  <link rel="stylesheet" href="/src/styles/monitor.css">
  <link rel="stylesheet" href="/src/styles/crt.css">
  <link rel="stylesheet" href="/src/styles/terminal.css">
</head>
<body>
  <div id="crt-assembly">
    <!-- Monitor head -->
    <div id="crt-monitor">
      <div id="monitor-frame">
        <div id="screen-bezel">
          <div id="screen-recess">
            <div id="screen-container">
              <div id="crt-overlay"></div>
              <canvas id="crt-shader-canvas"></canvas>
              <pre id="ascii-background"></pre>
              <div id="terminal"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="monitor-brand">Hunter Dermott</div>
      <div id="power-led"></div>
    </div>

    <!-- Monitor stand -->
    <div id="monitor-stand">
      <div id="stand-neck">
        <div id="neck-highlight"></div>
      </div>
      <div id="stand-base">
        <div id="base-top"></div>
        <div id="base-foot"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
