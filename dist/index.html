<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunter Dermott - Terminal Portfolio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Hidden terminal input handler */
    #terminal-input-capture {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 1px;
      height: 1px;
      opacity: 0;
      z-index: -1;
    }
    /* ─── Command Menu ─── */
    #command-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 100;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    #command-menu-toggle {
      background: rgba(30, 30, 30, 0.92);
      color: #33ff33;
      border: 1px solid #33ff33;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      border-radius: 0 4px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    #command-menu-content {
      background: rgba(20, 20, 20, 0.92);
      border: 1px solid #33ff33;
      border-top: none;
      padding: 14px;
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.2s ease;
    }
    #command-menu.minimized #command-menu-content {
      max-height: 0;
      opacity: 0;
      padding: 0 14px;
      pointer-events: none;
      overflow: hidden;
    }
    .cmd-btn {
      background: rgba(51, 255, 51, 0.08);
      color: #33ff33;
      border: 1px solid rgba(51, 255, 51, 0.3);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .cmd-btn:hover {
      background: rgba(51, 255, 51, 0.25);
    }
    /* Desktop: bottom-left, wider */
    @media (min-width: 769px) {
      #command-menu {
        bottom: 12px;
        left: 12px;
        max-width: 320px;
      }
      #command-menu-content {
        max-height: 220px;
        border-radius: 0 4px 4px 4px;
      }
    }
    /* Mobile: full-width bottom bar */
    @media (max-width: 768px) {
      #command-menu {
        left: 0;
        width: 100%;
      }
      #command-menu-content {
        max-height: 180px;
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BkboUkqg.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <input type="text" id="terminal-input-capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
  <div id="command-menu">
    <button id="command-menu-toggle">Commands ▼</button>
    <div id="command-menu-content"></div>
  </div>
</body>
</html>
