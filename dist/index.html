<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunter Dermott - Terminal Portfolio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Hidden terminal input handler */
    #terminal-input-capture {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 1px;
      height: 1px;
      opacity: 0;
      z-index: -1;
    }
    /* ─── Command Menu ─── */
    #command-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 100;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    #command-menu.minimized #command-menu-toggle {
      border-bottom: 1px solid #33ff33;
      border-radius: 4px;
    }
    #command-menu-toggle {
      background: rgba(30, 30, 30, 0.92);
      color: #33ff33;
      border: 1px solid #33ff33;
      border-bottom: none;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      border-radius: 0 4px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    #command-menu-content {
      background: rgba(20, 20, 20, 0.92);
      border: 1px solid #33ff33;
      padding: 14px;
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.2s ease;
      /* Custom scrollbar — theme-matched */
      scrollbar-width: thin;
      scrollbar-color: rgba(51, 255, 51, 0.35) rgba(0, 0, 0, 0.3);
    }
    #command-menu-content::-webkit-scrollbar {
      width: 5px;
    }
    #command-menu-content::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2px;
    }
    #command-menu-content::-webkit-scrollbar-thumb {
      background: rgba(51, 255, 51, 0.35);
      border-radius: 2px;
    }
    #command-menu-content::-webkit-scrollbar-thumb:hover {
      background: rgba(51, 255, 51, 0.55);
    }
    #command-menu.minimized #command-menu-content {
      max-height: 0;
      opacity: 0;
      padding: 0 14px;
      pointer-events: none;
      overflow: hidden;
    }
    .cmd-group-label {
      width: 100%;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 4px 0 2px 0;
      opacity: 0.85;
    }
    .cmd-divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      margin: 6px 0;
    }
    .cmd-btn {
      background: rgba(51, 255, 51, 0.08);
      color: #33ff33;
      border: 1px solid rgba(51, 255, 51, 0.3);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .cmd-btn:hover {
      background: rgba(51, 255, 51, 0.25);
      transform: translateY(-1px);
    }
    /* Color-coded groups */
    .cmd-btn[data-group="Effects & Games"] {
      color: #ffaa00;
      border-color: rgba(255, 170, 0, 0.35);
      background: rgba(255, 170, 0, 0.08);
    }
    .cmd-btn[data-group="Effects & Games"]:hover {
      background: rgba(255, 170, 0, 0.22);
    }
    .cmd-btn[data-group="Linux"] {
      color: #8888ff;
      border-color: rgba(136, 136, 255, 0.35);
      background: rgba(136, 136, 255, 0.08);
    }
    .cmd-btn[data-group="Linux"]:hover {
      background: rgba(136, 136, 255, 0.22);
    }
    /* Desktop: bottom-left, wider */
    @media (min-width: 769px) {
      #command-menu {
        bottom: 12px;
        left: 12px;
        max-width: 420px;
      }
      #command-menu-content {
        max-height: 340px;
        border-radius: 0 4px 4px 4px;
      }
    }
    /* Mobile: full-width bottom bar */
    @media (max-width: 768px) {
      #command-menu {
        left: 0;
        width: 100%;
      }
      #command-menu-content {
        max-height: 300px;
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BRAWm-SY.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <input type="text" id="terminal-input-capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
  <div id="command-menu">
    <button id="command-menu-toggle">Commands ▼</button>
    <div id="command-menu-content"></div>
  </div>
</body>
</html>
