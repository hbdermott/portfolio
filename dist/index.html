<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunter Dermott - Terminal Portfolio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Hidden terminal input handler */
    #terminal-input-capture {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 1px;
      height: 1px;
      opacity: 0;
      z-index: -1;
    }
    /* ─── Command Menu ─── */
    #command-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 100;
      font-family: 'Courier New', monospace;
      transition: transform 0.25s ease;
    }
    #command-menu.minimized {
      transform: translateY(calc(100% - 36px));
    }
    #command-menu.minimized #command-menu-content {
      opacity: 0;
      pointer-events: none;
    }
    #command-menu-toggle {
      background: rgba(30, 30, 30, 0.92);
      color: #33ff33;
      border: 1px solid #33ff33;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #command-menu-content {
      background: rgba(20, 20, 20, 0.92);
      border: 1px solid #33ff33;
      border-top: none;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cmd-btn {
      background: rgba(51, 255, 51, 0.08);
      color: #33ff33;
      border: 1px solid rgba(51, 255, 51, 0.3);
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s;
    }
    .cmd-btn:hover {
      background: rgba(51, 255, 51, 0.2);
    }
    /* Desktop: left panel */
    @media (min-width: 769px) {
      #command-menu {
        bottom: auto;
        top: 50%;
        left: 12px;
        transform: translateY(-50%);
        max-width: 200px;
      }
      #command-menu.minimized {
        transform: translateY(-50%) translateX(-100%);
      }
      #command-menu.minimized #command-menu-toggle {
        position: fixed;
        left: 0;
        bottom: 12px;
        transform: translateX(0);
        border-radius: 0 4px 4px 0;
        border-left: none;
      }
      #command-menu-content {
        max-height: 60vh;
        border-radius: 0 0 4px 4px;
      }
      #command-menu-toggle {
        border-radius: 4px 4px 0 0;
      }
    }
    /* Mobile: bottom bar */
    @media (max-width: 768px) {
      #command-menu {
        left: 0;
        width: 100%;
      }
      #command-menu-content {
        max-height: 160px;
      }
      #command-menu.minimized #command-menu-toggle {
        border-radius: 4px 4px 0 0;
        margin-left: 12px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-DfFKJa4e.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <input type="text" id="terminal-input-capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
  <div id="command-menu">
    <button id="command-menu-toggle">Commands ▼</button>
    <div id="command-menu-content"></div>
  </div>
</body>
</html>
